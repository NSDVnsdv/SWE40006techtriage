# Below is the code to name this workflow "CI", which is how it appears in the GitHub Actions tab.
name: CI

# Below is the code to choose when it runs: on every push to any branch, on every pull request into main or develop,
# and by hand with the "Run workflow" button.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Below is the code to give the workflow only the permissions it needs: read the code, upload images to GHCR,
# and read this run's own job timings (for the pipeline timings report at the end).
permissions:
  contents: read
  packages: write
  actions: read

jobs:
  # Below is the code to run the "test" job, a required check on pull requests: lint, rule schema check,
  # unit and integration tests, and both coverage gates. The image is only built after this passes.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Below is the code to start a throwaway PostgreSQL database beside the job for the integration tests.
    # GitHub deletes it as soon as the job finishes.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: techtriage
          POSTGRES_PASSWORD: techtriage
          POSTGRES_DB: techtriage
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U techtriage"
          --health-interval 5s --health-timeout 3s --health-retries 10

    # Below is the code to tell the integration tests where that throwaway database is.
    env:
      TEST_DATABASE_URL: postgresql://techtriage:techtriage@localhost:5432/techtriage

    steps:
      # Below is the code to download the repository's code onto GitHub's machine.
      - name: Check out code
        uses: actions/checkout@v4

      # Below is the code to install Python 3.12 and reuse packages downloaded by earlier runs, to save time.
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      # Below is the code to install the app's packages and the testing tools.
      - name: Install packages
        run: pip install -r requirements-dev.txt

      # Below is the code to check the Python code for mistakes and unused code (lint).
      - name: Lint (ruff)
        run: ruff check --output-format=github .

      # Below is the code to check every troubleshooting rule file has all the required fields.
      - name: Rule schema check
        run: python rules.py

      # Below is the code to run the unit and integration tests, measure coverage and fail below 80%.
      # The results are also saved as files: a JUnit test report, a coverage XML file and an HTML coverage report.
      - name: Unit and integration tests with coverage (80% gate)
        run: >-
          python -m pytest tests/test_unit.py tests/test_integration.py
          --junitxml=reports/junit.xml
          --cov --cov-fail-under=80
          --cov-report=term-missing --cov-report=xml:reports/coverage.xml --cov-report=html:reports/coverage-html

      # Below is the code to fail the job if the rules engine (rules.py) has less than 95% coverage.
      - name: Rules engine coverage (95% gate)
        run: python -m coverage report --include=rules.py --fail-under=95

      # Below is the code to save the test and coverage reports with the run, even when a test fails,
      # so they can be downloaded from the run's Summary page.
      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/
          retention-days: 30

  # Below is the code to run the "build" job: package the app as a Docker image tagged with the commit ID (SHA)
  # and upload it to GHCR. It waits for the tests to pass, and pull requests build the image but never upload it.
  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      # Below is the code to download the repository's code onto GitHub's machine.
      - name: Check out code
        uses: actions/checkout@v4

      # Below is the code to work out the image name, which GHCR needs in lowercase.
      - name: Work out image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/swe40006techtriage" >> "$GITHUB_ENV"

      # Below is the code to choose the image's tags: always the full commit ID, plus "latest" on the main branch.
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # Below is the code to set up Docker's image builder, which can reuse parts of earlier builds.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Below is the code to log in to GHCR with GitHub's built-in token. Pull requests skip this because they never upload.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Below is the code to build the image with the commit ID saved inside it, and upload it unless this is a pull request.
      - name: Build (and push unless this is a pull request)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: GIT_SHA=${{ github.sha }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Below is the code to write the commit ID, the image tags and the image digest (its unique fingerprint)
      # on the run's Summary page.
      - name: Summary
        run: |
          {
            echo "### Image"
            echo "Commit: \`${{ github.sha }}\`"
            echo "Pushed: ${{ github.event_name != 'pull_request' }}"
            echo "Digest: \`${{ steps.build.outputs.digest }}\`"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Below is the code to save the image's commit ID and digest as a file with the run (a build artifact),
      # so the report can show the exact image that went to every server.
      - name: Save image digest
        if: github.event_name != 'pull_request'
        run: |
          printf 'image=%s\ncommit=%s\ndigest=%s\n' "$IMAGE" "${{ github.sha }}" "${{ steps.build.outputs.digest }}" > image-digest.txt
          cat image-digest.txt
      - name: Upload image digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: image-digest
          path: image-digest.txt
          retention-days: 30

  # ---------------------------------------------------------------------------------------------------------------
  # LEVEL 4: automatic deploys. Nobody presses anything until the Production approval.
  #   merge into develop -> build -> Development (+ /health and smoke tests)
  #   merge into main    -> build ONCE -> Testing (+ Playwright) -> Staging (+ smoke) -> [Approve] -> Production (+ smoke)
  # Every server gets the SAME image: the one tagged with this run's commit ID.
  # ---------------------------------------------------------------------------------------------------------------

  # Below is the code to deploy every merge into "develop" to the Development server.
  deploy-development:
    name: Development
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: development
      image_tag: ${{ github.sha }}
      expected_digest: ${{ needs.build.outputs.digest }}
    secrets: inherit

  # Below is the code to deploy every merge into "main" to the Testing server and run the Playwright browser tests there.
  deploy-testing:
    name: Testing
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: testing
      image_tag: ${{ github.sha }}
      expected_digest: ${{ needs.build.outputs.digest }}
    secrets: inherit

  # Below is the code to deploy the same image to Staging, only after Testing and Playwright have passed.
  deploy-staging:
    name: Staging
    needs: [build, deploy-testing]
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      image_tag: ${{ github.sha }}
      expected_digest: ${{ needs.build.outputs.digest }}
    secrets: inherit

  # Below is the code to deploy the same image to Production, only after Staging passed AND a reviewer clicks "Approve"
  # (the "production" GitHub environment has a required reviewer). A failed /health here rolls back automatically.
  deploy-production:
    name: Production
    needs: [build, deploy-staging]
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      image_tag: ${{ github.sha }}
      expected_digest: ${{ needs.build.outputs.digest }}
    secrets: inherit

  # Below is the code to measure the run against the brief's Table 7 targets at the very end, and save the
  # results as a file with the run (pipeline-report) and on the run's Summary page.
  report:
    name: Pipeline timings
    needs: [test, build, deploy-development, deploy-testing, deploy-staging, deploy-production]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Measure this run
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_DIGEST: ${{ needs.build.outputs.digest }}
          DEV_DIGEST: ${{ needs.deploy-development.outputs.digest }}
          TESTING_DIGEST: ${{ needs.deploy-testing.outputs.digest }}
          STAGING_DIGEST: ${{ needs.deploy-staging.outputs.digest }}
          PRODUCTION_DIGEST: ${{ needs.deploy-production.outputs.digest }}
        run: bash scripts/pipeline-report.sh | tee pipeline-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Save pipeline report
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-report
          path: pipeline-report.md
          retention-days: 30
