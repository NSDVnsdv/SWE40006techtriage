# Below is the code to name this workflow "Deploy", which is how it appears in the GitHub Actions tab.
name: Deploy

# Below is the code to start a deploy in two ways:
#  - the "Run workflow" button (pick a server and an image), which is the brief's manual backup plan, and
#  - from the CI workflow, which is how Level 4 deploys automatically after every merge.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Which server to deploy to
        type: choice
        options: [development, testing, staging, production]
        required: true
      image_tag:
        description: Full commit ID (SHA) of the image to deploy, taken from a green CI run
        type: string
        required: true
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      image_tag:
        type: string
        required: true
      expected_digest:
        description: Digest the CI build produced, used to prove every server runs the same image
        type: string
        required: false
        default: ""
    outputs:
      url:
        value: ${{ jobs.deploy.outputs.url }}
      digest:
        value: ${{ jobs.deploy.outputs.digest }}

# Below is the code to let this workflow only read the code. It never changes the repository.
permissions:
  contents: read

# Below is the code to allow only one deploy at a time to each server. If two releases reach Production
# together, the second one waits until the first has completely finished (it is never cancelled half-way).
concurrency:
  group: techtriage-deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  # Below is the code to run the "deploy" job: update the chosen server to the chosen image through AWS Systems Manager,
  # wait until /health says the database is connected and, on Production, roll back automatically if it never does.
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.address.outputs.url }}
    outputs:
      url: ${{ steps.address.outputs.url }}
      digest: ${{ steps.deploy.outputs.digest }}
    defaults:
      run:
        shell: bash
    env:
      INSTANCE_ID: ${{ vars.INSTANCE_ID }}
      IMAGE_TAG: ${{ inputs.image_tag }}
      TARGET_ENV: ${{ inputs.environment }}
    steps:
      # Below is the code to download the repository's code (it holds the deploy and rollback scripts) onto GitHub's machine.
      - name: Check out code
        uses: actions/checkout@v4

      # Below is the code to stop straight away if the image is not a full 40-character commit ID,
      # or if this environment has no INSTANCE_ID saved in its GitHub settings.
      - name: Check the inputs
        run: |
          [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::image_tag must be the full 40-character commit ID"; exit 1; }
          [ -n "$INSTANCE_ID" ] || { echo "::error::Add an INSTANCE_ID variable to the '$TARGET_ENV' GitHub environment"; exit 1; }

      # Below is the code to log in to AWS with the keys saved as GitHub secrets.
      # Learner Lab keys expire when the lab session ends, so they are pasted in again each session.
      - name: Log in to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      # Below is the code to look up the server's current public address, because Development, Testing
      # and Staging get a new one every time they are stopped and started.
      - name: Find the server's address
        id: address
        run: |
          ip=$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].PublicIpAddress' --output text)
          [ "$ip" != "None" ] || { echo "::error::The $TARGET_ENV server has no public address. Is it stopped?"; exit 1; }
          echo "url=http://$ip" >> "$GITHUB_OUTPUT"
          echo "$TARGET_ENV server $INSTANCE_ID is at http://$ip"

      # Below is the code to send scripts/server-deploy.sh to the server through Systems Manager and print what it printed.
      # It also reads the running image's digest from the output and compares it with the one CI built.
      - name: Deploy with Systems Manager
        id: deploy
        env:
          EXPECTED_DIGEST: ${{ inputs.expected_digest }}
        run: |
          { printf 'REPO=%s\nTAG=%s\n' "$GITHUB_REPOSITORY" "$IMAGE_TAG"; cat scripts/server-deploy.sh; } > deploy-script.sh
          echo "Deploy started at $(date -u +%H:%M:%S) UTC"
          bash scripts/ssm-run.sh "$INSTANCE_ID" "TechTriage deploy ${IMAGE_TAG:0:7} to $TARGET_ENV" deploy-script.sh | tee deploy-output.txt
          digest=$(grep -o 'RUNNING_DIGEST=sha256:[0-9a-f]*' deploy-output.txt | head -1 | cut -d= -f2 || true)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Running image digest: ${digest:-unknown}"
          if [ -n "$EXPECTED_DIGEST" ] && [ "$digest" != "$EXPECTED_DIGEST" ]; then
            echo "::warning::$TARGET_ENV runs digest $digest but CI built $EXPECTED_DIGEST"
          fi

      # Below is the code to check the deploy worked: /health must report the database as connected within 3 minutes.
      - name: Wait for /health
        run: bash scripts/wait-for-health.sh "${{ steps.address.outputs.url }}"

      # Below is the code to roll back AUTOMATICALLY, on Production only, when the deploy or its /health check failed:
      # put the previous working image back, then check /health again. The run still shows as failed (red).
      - name: Automatic rollback (Production only)
        id: rollback
        if: failure() && inputs.environment == 'production' && steps.deploy.outcome != 'skipped'
        run: |
          echo "::warning::Production failed its /health check. Rolling back to the previous image."
          echo "Rollback started at $(date -u +%H:%M:%S) UTC"
          bash scripts/ssm-run.sh "$INSTANCE_ID" "TechTriage ROLLBACK on production" scripts/server-rollback.sh | tee rollback-output.txt
          bash scripts/wait-for-health.sh "${{ steps.address.outputs.url }}"
          echo "Rollback finished, Production healthy again at $(date -u +%H:%M:%S) UTC"
          echo "### :rewind: Automatic rollback ran on Production and /health is OK again" >> "$GITHUB_STEP_SUMMARY"

      # Below is the code to write the server, image and digest on the run's Summary page.
      - name: Summary
        if: always()
        run: |
          {
            echo "### Deploy to $TARGET_ENV"
            echo "| | |"
            echo "|---|---|"
            echo "| Server | ${{ steps.address.outputs.url }} |"
            echo "| Image (commit) | \`$IMAGE_TAG\` |"
            echo "| Running digest | \`${{ steps.deploy.outputs.digest }}\` |"
            echo "| Rollback | ${{ steps.rollback.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      # Below is the code to save the server's deploy (and any rollback) output with the run, as evidence.
      - name: Save deploy log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.environment }}-deploy-log
          path: |
            deploy-output.txt
            rollback-output.txt
          if-no-files-found: ignore
          retention-days: 30

  # Below is the code to run the "verify" job after a successful deploy: the Playwright browser tests on Testing,
  # or the 2 smoke tests on every other server, against the server that was just updated.
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: ${{ needs.deploy.outputs.url }}
      EXPECTED_SHA: ${{ inputs.image_tag }}
      EXPECTED_ENV: ${{ inputs.environment }}
    steps:
      # Below is the code to download the repository's code (it holds the tests) onto GitHub's machine.
      - name: Check out code
        uses: actions/checkout@v4

      # Below is the code to install Python 3.12 and reuse packages downloaded by earlier runs, to save time.
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      # Below is the code to install the testing tools.
      - name: Install packages
        run: pip install -r requirements-dev.txt

      # Below is the code to install the Chromium browser that Playwright drives (only needed for Testing).
      - name: Install the Playwright browser
        if: inputs.environment == 'testing'
        run: python -m playwright install --with-deps chromium

      # Below is the code to run the Playwright browser tests against the Testing server,
      # keeping a trace (a step-by-step recording) of every test so it can be replayed later.
      - name: Playwright browser tests
        if: inputs.environment == 'testing'
        run: >-
          python -m pytest tests/test_e2e.py --base-url "$BASE_URL"
          --tracing on --output reports/playwright-traces --junitxml=reports/e2e-junit.xml

      # Below is the code to run the 2 smoke tests (database connected, expected commit) on every other server.
      - name: Smoke tests
        if: inputs.environment != 'testing'
        run: python -m pytest tests/test_smoke.py --base-url "$BASE_URL" --junitxml=reports/smoke-junit.xml

      # Below is the code to save the test reports, and the Playwright traces, with the run.
      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.environment }}-test-reports
          path: reports/
          if-no-files-found: ignore
          retention-days: 30
